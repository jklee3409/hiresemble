spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  application:
    name: hiresemble-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hiresemble}
    username: ${DATABASE_USERNAME:hiresemble}
    password: ${DATABASE_PASSWORD:hiresemble-local-password}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    timeout: ${SESSION_TIMEOUT:30m}
    jdbc:
      flush-mode: immediate
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  ai:
    model:
      chat: ${AI_CHAT_MODEL_PROVIDER:none}
      embedding: ${AI_EMBEDDING_MODEL_PROVIDER:none}
    openai:
      api-key: ${AI_PROVIDER_API_KEY:local-not-configured}
      base-url: ${AI_PROVIDER_BASE_URL:https://api.openai.com/v1}
      chat:
        options:
          model: ${AI_MODEL_BALANCED:gpt-5-mini}
          max-retries: ${AI_PROVIDER_MAX_RETRIES:0}
          store: ${AI_PROVIDER_STORE:false}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${AI_EMBEDDING_DIMENSION:1536}
          max-retries: ${AI_PROVIDER_MAX_RETRIES:0}
    vectorstore:
      type: ${AI_VECTOR_STORE_PROVIDER:none}
      pgvector:
        initialize-schema: false

server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: ${SESSION_COOKIE_NAME:SESSION}
        http-only: ${SESSION_COOKIE_HTTP_ONLY:true}
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

hiresemble:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  github:
    enabled: ${GITHUB_INGESTION_ENABLED:false}
    api-base-url: https://api.github.com
    api-version: ${GITHUB_API_VERSION:2026-03-10}
    retrieval-policy-version: github-snapshot-v1
    connect-timeout: ${GITHUB_CONNECT_TIMEOUT:3s}
    response-timeout: ${GITHUB_RESPONSE_TIMEOUT:10s}
    max-response-bytes: 8388608
    max-concurrent-requests: 2
    max-discovered-repositories: 200
    max-selected-repositories: 10
    max-candidate-files: 80
    max-text-file-bytes: 65536
    max-sanitized-code-points: 400000
    max-candidates-per-repository: 12
    max-candidates-per-run: 40
    deletion-scan-interval: 30s
  career-artifact:
    enabled: ${CAREER_ARTIFACT_ENABLED:false}
    max-generated-file-bytes: ${CAREER_ARTIFACT_MAX_FILE_BYTES:10485760}
    deletion-scan-interval: ${CAREER_ARTIFACT_DELETION_SCAN_INTERVAL:30s}
  idempotency:
    current-hash-key-version: ${IDEMPOTENCY_HASH_KEY_VERSION:1}
    hmac-keys:
      1: ${IDEMPOTENCY_HMAC_KEY:}
    ttl: 24h
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:hiresemble}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:hiresemble-local-secret}
    bucket: ${OBJECT_STORAGE_BUCKET:hiresemble}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
  document:
    parser:
      timeout: ${DOCUMENT_PARSER_TIMEOUT:15s}
      max-pages: ${DOCUMENT_PARSER_MAX_PAGES:500}
      max-zip-entries: ${DOCUMENT_PARSER_MAX_ZIP_ENTRIES:5000}
      max-uncompressed-bytes: ${DOCUMENT_PARSER_MAX_UNCOMPRESSED_BYTES:104857600}
  object-deletion-outbox:
    scan-interval: ${OBJECT_DELETION_SCAN_INTERVAL:30s}
    lease-duration: ${OBJECT_DELETION_LEASE_DURATION:2m}
    batch-size: ${OBJECT_DELETION_BATCH_SIZE:20}
  job-page-fetch:
    connect-timeout: ${JOB_PAGE_CONNECT_TIMEOUT:3s}
    response-timeout: ${JOB_PAGE_RESPONSE_TIMEOUT:10s}
    max-redirects: ${JOB_PAGE_MAX_REDIRECTS:5}
    max-response-bytes: ${JOB_PAGE_MAX_RESPONSE_BYTES:2097152}
    image-response-timeout: ${JOB_IMAGE_RESPONSE_TIMEOUT:15s}
    max-image-candidates: ${JOB_IMAGE_MAX_CANDIDATES:6}
    max-image-bytes: ${JOB_IMAGE_MAX_BYTES:5242880}
    max-total-image-bytes: ${JOB_IMAGE_MAX_TOTAL_BYTES:20971520}
    max-image-pixels: ${JOB_IMAGE_MAX_PIXELS:40000000}
    min-dom-meaningful-characters: ${JOB_PAGE_MIN_DOM_CHARACTERS:600}
    min-description-meaningful-characters: ${JOB_MIN_DESCRIPTION_CHARACTERS:120}
    min-image-item-meaningful-characters: ${JOB_IMAGE_MIN_ITEM_MEANINGFUL_CHARACTERS:20}
    max-replacement-character-ratio: ${JOB_MAX_REPLACEMENT_RATIO:0.001}
  job:
    auto-analysis:
      scan-interval: ${JOB_AUTO_ANALYSIS_SCAN_INTERVAL:5s}
      lease-duration: ${JOB_AUTO_ANALYSIS_LEASE_DURATION:1m}
      retry-delay: ${JOB_AUTO_ANALYSIS_RETRY_DELAY:15s}
      batch-size: ${JOB_AUTO_ANALYSIS_BATCH_SIZE:20}
      max-attempts: ${JOB_AUTO_ANALYSIS_MAX_ATTEMPTS:3}
  job-deadline-scheduler:
    cron: ${JOB_DEADLINE_SCHEDULER_CRON:0 0 * * * *}
    batch-size: ${JOB_DEADLINE_SCHEDULER_BATCH_SIZE:100}
  ai:
    provider: ${AI_PROVIDER:none}
    provider-timeout: ${AI_PROVIDER_TIMEOUT:60s}
    model-low-cost: ${AI_MODEL_LOW_COST:}
    model-balanced: ${AI_MODEL_BALANCED:gpt-5-mini}
    model-high-quality: ${AI_MODEL_HIGH_QUALITY:}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding:
      dimension: ${AI_EMBEDDING_DIMENSION:1536}
  agent-runtime:
    heartbeat-interval: ${AGENT_HEARTBEAT_INTERVAL:15s}
    lease-duration: ${AGENT_LEASE_DURATION:60s}
    reconciliation-interval: ${AGENT_RECONCILIATION_INTERVAL:30s}
    dispatch-interval: ${AGENT_DISPATCH_INTERVAL:1s}
    worker-threads: ${AGENT_WORKER_THREADS:2}
    queue-capacity: ${AGENT_QUEUE_CAPACITY:32}
    reconciliation-batch-size: ${AGENT_RECONCILIATION_BATCH_SIZE:50}
    worker-id: ${AGENT_WORKER_ID:local-worker}
  search:
    provider: ${WEB_SEARCH_PROVIDER:none}
    tavily-api-key: ${TAVILY_API_KEY:}
    tavily-endpoint: ${TAVILY_ENDPOINT:https://api.tavily.com/search}
    allow-insecure-endpoint: ${ALLOW_INSECURE_PROVIDER_ENDPOINT:false}

logging:
  level:
    org.springframework.ai.openai.OpenAiChatModel: ERROR
    org.springframework.ai.openai.OpenAiEmbeddingModel: INFO
